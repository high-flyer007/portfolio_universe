<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-label="Portrait placeholder">
  <defs>
    <radialGradient id="halo" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#2be39b" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#0d3b2b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#050706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16241f"/>
      <stop offset="100%" stop-color="#070d0a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2be39b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2be39b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2be39b" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#2be39b" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="1120" fill="#050706"/>
  <rect width="900" height="1120" fill="url(#grid)"/>
  <circle cx="450" cy="430" r="420" fill="url(#halo)"/>

  <g opacity="0.55" stroke="#2be39b" fill="none">
    <circle cx="450" cy="430" r="310" stroke-opacity="0.22"/>
    <circle cx="450" cy="430" r="355" stroke-opacity="0.12" stroke-dasharray="2 12"/>
    <circle cx="450" cy="430" r="240" stroke-opacity="0.1"/>
  </g>

  <g>
    <path d="M450 430c58 0 104-50 104-112s-46-112-104-112-104 50-104 112 46 112 104 112Z" fill="url(#figure)" stroke="#2be39b" stroke-opacity="0.25"/>
    <path d="M206 840c0-140 108-232 244-232s244 92 244 232v180H206V840Z" fill="url(#figure)" stroke="#2be39b" stroke-opacity="0.2"/>
  </g>

  <rect x="90" y="1060" width="720" height="1" fill="url(#edge)"/>
  <text x="90" y="120" fill="#8ea69b" font-family="monospace" font-size="14" letter-spacing="6">ALIVERSE / ORIGIN</text>
  <text x="90" y="1020" fill="#cdf7e8" font-family="monospace" font-size="16" letter-spacing="4">PORTRAIT PLACEHOLDER</text>
  <text x="90" y="1048" fill="#5f7a6e" font-family="monospace" font-size="12" letter-spacing="2">Replace with public/portrait.jpg</text>
  <text x="810" y="120" fill="#2be39b" font-family="monospace" font-size="14" text-anchor="end" letter-spacing="4">02</text>
</svg>
